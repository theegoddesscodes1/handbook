<!-- Analytics (Umami, no cookies): page views per planner, plus Handbook clicks as named events -->
<script>
window.hbTrack = function (name, data) {
  if (name === 'search') return; // typed searches fire on every keystroke, skip them
  try {
    var d = {}; for (var k in (data || {})) d[k] = String(data[k]).slice(0, 200);
    var p = new URLSearchParams(location.search).get('p');
    if (!p) { try { p = JSON.parse(localStorage.getItem('hb_product')); } catch (e) {} }
    if (p) d.planner = p;
    if (window.umami && window.umami.track) window.umami.track(name, d);
  } catch (e) {}
};
</script>
<script defer src="https://cloud.umami.is/script.js" data-website-id="7b0954ea-3201-42cd-af96-dba0755b734f"></script>
